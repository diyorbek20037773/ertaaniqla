# Production overrides (spec §11.1): nginx + certbot, resource limits, JSON logging, backup
# container, optional ClamAV (`--profile clamav`) and monitoring stack (`--profile monitoring`).
# Usage: docker compose -f compose.yml -f compose.prod.yml [--profile monitoring] up -d
# Staging = same files, different project name + env file:
#   docker compose -p ertaaniqla-staging --env-file .env.staging -f compose.yml -f compose.prod.yml up -d
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

# OpenTelemetry (ADR-0005): traces go to Jaeger when OTEL_EXPORTER_OTLP_ENDPOINT is set in .env
# (http://jaeger:4318 with the monitoring profile). 10 % head sampling, children follow parents.
x-otel: &otel
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none

services:
  db:
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - wal_level=replica
      - -c
      - max_wal_size=2GB
      - -c
      - log_min_duration_statement=500
    shm_size: 1g
    deploy:
      resources:
        limits:
          memory: 4g
    logging: *logging

  redis:
    deploy:
      resources:
        limits:
          memory: 640m
    logging: *logging

  migrate:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    logging: *logging

  web:
    environment:
      <<: *otel
      DJANGO_SETTINGS_MODULE: config.settings.prod
      MEDIA_ROOT: /srv/media
      PAGE_CACHE_SECONDS: ${PAGE_CACHE_SECONDS:-300}
    deploy:
      resources:
        limits:
          memory: 4g
    logging: *logging
    expose:
      - "8000"

  worker:
    environment:
      <<: *otel
      DJANGO_SETTINGS_MODULE: config.settings.prod
      MEDIA_ROOT: /srv/media
    deploy:
      resources:
        limits:
          memory: 2g
    logging: *logging

  beat:
    environment:
      <<: *otel
      DJANGO_SETTINGS_MODULE: config.settings.prod
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-ertaaniqla.uz}
      DOMAIN_ALT: ${DOMAIN_ALT:-www.ertaaniqla.uz oncoportal.uz www.oncoportal.uz}
      STAGING_DOMAIN: ${STAGING_DOMAIN:-staging.ertaaniqla.uz}
      STAGING_UPSTREAM: ${STAGING_UPSTREAM:-ertaaniqla-staging-web-1:8000}
      SONAR_DOMAIN: ${SONAR_DOMAIN:-sonar.ertaaniqla.uz}
      SONAR_UPSTREAM: ${SONAR_UPSTREAM:-ertaaniqla-sonarqube-sonarqube-1:9000}
      NGINX_ENVSUBST_TEMPLATE_DIR: /etc/nginx/templates
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      - ${STAGING_HTPASSWD:-./docker/nginx/staging.htpasswd.example}:/etc/nginx/staging.htpasswd:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      - nginx-cache:/var/cache/nginx
      - ./docker/nginx/maintenance:/srv/maintenance:ro   # `touch docker/nginx/maintenance/maintenance.flag`
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

  certbot:
    image: certbot/certbot:latest
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet --deploy-hook 'touch /etc/letsencrypt/.renewed'; sleep 12h & wait $${!}; done"]
    restart: unless-stopped
    logging: *logging

  # reloads nginx when certbot renewed a certificate (checks the marker every 10 min)
  nginx-reloader:
    image: docker:27-cli
    command: ["/bin/sh", "-c", "while :; do if [ -f /etc/letsencrypt/.renewed ]; then rm -f /etc/letsencrypt/.renewed; docker exec ${COMPOSE_PROJECT_NAME:-ertaaniqla}-nginx-1 nginx -s reload && echo reloaded; fi; sleep 600; done"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    logging: *logging

  backup:
    image: ${WEB_IMAGE:-ertaaniqla/web:local}
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ertaaniqla}:${POSTGRES_PASSWORD:-ertaaniqla}@db:5432/${POSTGRES_DB:-ertaaniqla}
      PGPASSWORD: ${POSTGRES_PASSWORD:-ertaaniqla}
      BACKUP_DIR: /backups
      MEDIA_ROOT: /srv/media
      TZ: Asia/Tashkent
    command: ["backup-cron"]
    healthcheck:
      disable: true   # not a web role; BackupTooOld / RestoreTestTooOld alerts cover it
    volumes:
      - media:/srv/media:ro
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped
    logging: *logging

  clamav:
    image: clamav/clamav:stable
    profiles: ["clamav"]
    volumes:
      - clamav:/var/lib/clamav
    restart: unless-stopped
    logging: *logging

  # --- monitoring profile (spec §11.5) ----------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    # the config has no env expansion: fill the Django basic-auth + domain placeholders at start
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        U="$${METRICS_BASIC_AUTH%%:*}"; P="$${METRICS_BASIC_AUTH#*:}";
        sed "s|__METRICS_USER__|$$U|;s|__METRICS_PASS__|$$P|;s|__DOMAIN__|$$DOMAIN|g"
        /etc/prometheus/prometheus.tpl.yml > /prometheus/prometheus.yml &&
        exec prometheus --config.file=/prometheus/prometheus.yml
        --storage.tsdb.retention.time=30d --web.enable-lifecycle
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.tpl.yml:ro
      - ./docker/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    environment:
      METRICS_BASIC_AUTH: ${METRICS_BASIC_AUTH:-prometheus:change-me}
      DOMAIN: ${DOMAIN:-ertaaniqla.uz}
    expose:
      - "9090"
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped
    logging: *logging

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["monitoring"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        sed "s|__TELEGRAM_BOT_TOKEN__|$$TELEGRAM_BOT_TOKEN|;s|__TELEGRAM_ALERT_CHAT_ID__|$$TELEGRAM_ALERT_CHAT_ID|"
        /etc/alertmanager/alertmanager.tpl.yml > /alertmanager/alertmanager.yml &&
        exec alertmanager --config.file=/alertmanager/alertmanager.yml --storage.path=/alertmanager
    volumes:
      - ./docker/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.tpl.yml:ro
      - alertmanager-data:/alertmanager
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALERT_CHAT_ID: ${TELEGRAM_ALERT_CHAT_ID:-0}
    expose:
      - "9093"
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"   # reach it over an SSH tunnel: ssh -L 3000:127.0.0.1:3000 vps
    restart: unless-stopped
    logging: *logging

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    profiles: ["monitoring"]
    command: ["--nginx.scrape-uri=http://nginx:8080/stub_status"]
    expose:
      - "9113"
    restart: unless-stopped
    logging: *logging

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    profiles: ["monitoring"]
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-ertaaniqla}:${POSTGRES_PASSWORD:-ertaaniqla}@db:5432/${POSTGRES_DB:-ertaaniqla}?sslmode=disable
    expose:
      - "9187"
    restart: unless-stopped
    logging: *logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    profiles: ["monitoring"]
    environment:
      REDIS_ADDR: redis://redis:6379
      # Celery broker = db 1 (compose.yml CELERY_BROKER_URL); queues are Redis lists
      REDIS_EXPORTER_CHECK_SINGLE_KEYS: db1=default,db1=media
    expose:
      - "9121"
    restart: unless-stopped
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: ["monitoring"]
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile/metrics
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro,rslave
      - backups:/textfile:ro
    pid: host
    expose:
      - "9100"
    restart: unless-stopped
    logging: *logging

  # certificate expiry + external-style HTTP probe of the public site
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    profiles: ["monitoring"]
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./docker/monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    expose:
      - "9115"
    restart: unless-stopped
    logging: *logging

  # --- logs + traces (monitoring profile, ADR-0005) ---------------------------------------
  # Loki/Jaeger run as uid 10001; named volumes are created root-owned → fix once per start.
  monitoring-init:
    image: busybox:1.37
    profiles: ["monitoring"]
    command: ["sh", "-c", "chown -R 10001:10001 /loki /badger"]
    volumes:
      - loki-data:/loki
      - jaeger-data:/badger
    restart: "no"
    logging: *logging

  loki:
    image: grafana/loki:3.7.0
    profiles: ["monitoring"]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./docker/monitoring/loki.yml:/etc/loki/loki.yml:ro
      - ./docker/monitoring/loki-rules:/etc/loki/rules:ro
      - loki-data:/loki
    depends_on:
      monitoring-init:
        condition: service_completed_successfully
    expose:
      - "3100"   # distroless image: no shell for a healthcheck; Alloy retries pushes until ready
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped
    logging: *logging

  # ships every container's stdout (docker json-file) to Loki; docker socket read-only
  alloy:
    image: grafana/alloy:v1.19.2
    profiles: ["monitoring"]
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "--disable-reporting", "/etc/alloy/config.alloy"]
    volumes:
      - ./docker/monitoring/alloy.config:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    expose:
      - "12345"
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped
    logging: *logging

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    profiles: ["monitoring"]
    command: ["--config", "/etc/jaeger/config.yml"]
    volumes:
      - ./docker/monitoring/jaeger.yml:/etc/jaeger/config.yml:ro
      - jaeger-data:/badger
    depends_on:
      monitoring-init:
        condition: service_completed_successfully
    expose:
      - "4318"    # OTLP/HTTP from web, worker, beat
    ports:
      - "127.0.0.1:16686:16686"   # UI over an SSH tunnel: ssh -L 16686:127.0.0.1:16686 vps
    deploy:
      resources:
        limits:
          memory: 768m
    restart: unless-stopped
    logging: *logging

volumes:
  letsencrypt:
  certbot-www:
  nginx-cache:
  backups:
  clamav:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  alloy-data:
  jaeger-data:
