# Prometheus (spec §11.5). __METRICS_USER__/__METRICS_PASS__ are filled from METRICS_BASIC_AUTH
# ("user:pass") by the container command in compose.prod.yml. Alerts → alertmanager → Telegram.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    project: ertaaniqla

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: django
    metrics_path: /metrics
    basic_auth:
      username: __METRICS_USER__
      password: __METRICS_PASS__
    static_configs:
      - targets: ["web:8000"]

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # public HTTPS probe through nginx: status, latency, certificate expiry
  - job_name: blackbox-https
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://__DOMAIN__/healthz/
          - https://__DOMAIN__/uz/
          - https://__DOMAIN__/ru/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
