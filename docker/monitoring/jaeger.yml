# Jaeger v2 (OpenTelemetry-collector based), all-in-one with Badger on a volume (ADR-0005).
# Receives OTLP/HTTP from web/worker/beat on :4318, UI + query API on :16686 (SSH tunnel only;
# Grafana's Jaeger datasource reads it too). Spans kept 7 days.
service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    logs:
      level: warn

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133
  jaeger_query:
    storage:
      traces: badger_store
    http:
      endpoint: 0.0.0.0:16686
  jaeger_storage:
    backends:
      badger_store:
        badger:
          directories:
            keys: /badger/keys
            values: /badger/values
          ephemeral: false
          ttl:
            spans: 168h

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  jaeger_storage_exporter:
    trace_storage: badger_store
