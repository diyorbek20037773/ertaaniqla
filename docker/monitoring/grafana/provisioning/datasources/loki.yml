# Loki (container logs via Alloy, ADR-0005). `trace_id` in a Django/Celery JSON line becomes a
# link to the trace in the Jaeger UI (opened through the same SSH tunnel: -L 16686:127.0.0.1:16686).
apiVersion: 1
datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: trace
          matcherType: regex
          matcherRegex: '"trace_id":\s*"([0-9a-f]{32})"'
          url: "http://localhost:16686/trace/${__value.raw}"
          urlDisplayLabel: "Open trace in Jaeger"
