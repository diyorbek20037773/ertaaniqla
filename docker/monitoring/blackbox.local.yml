# local rehearsal only: self-signed certificate
modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [200]
      follow_redirects: true
      fail_if_not_ssl: true
      tls_config:
        insecure_skip_verify: true
      headers:
        User-Agent: "ertaaniqla-blackbox/1.0"
