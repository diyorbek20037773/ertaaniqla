# Security headers (spec §8). CSP is set by Django (nonce per request) — never here.
# nginx gotcha: a location with its own add_header drops inherited ones, so every location
# that adds headers must `include snippets/security.conf;` itself.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Request-Id $request_id always;
