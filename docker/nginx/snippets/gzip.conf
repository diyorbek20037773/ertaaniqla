# gzip for text assets (spec §11.2). Pre-compressed .gz files (collectstatic + gzip_static) win.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain text/css text/xml text/javascript text/vtt
    application/javascript application/json application/ld+json application/manifest+json
    application/xml application/rss+xml application/atom+xml
    image/svg+xml font/woff2 font/woff font/ttf;
gzip_static on;
