# Common proxy settings for the Django upstream (timeouts live in nginx.conf http{} so a
# location can override them without a duplicate-directive error).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Request-Id $request_id;
proxy_buffers 16 32k;
proxy_buffer_size 64k;
proxy_redirect off;
# Django sets these too (SecurityMiddleware): drop its copies so each header goes out once,
# from snippets/security.conf (QA 2026-11-02 found them doubled, Permissions-Policy with two
# different values). CSP and Cross-Origin-Opener-Policy stay Django's.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Strict-Transport-Security;
