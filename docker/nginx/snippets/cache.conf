# Static / media caching (spec §11.2). Static files are content-hashed (ManifestStaticFilesStorage).
location /static/ {
    alias /srv/static/;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security.conf;
    access_log off;
    try_files $uri =404;
}

# Never served by nginx (spec §8): Wagtail documents (private consent forms are checked by
# Django at /documents/<id>/<name>) and raw video uploads (only transcoded renditions go out).
location ^~ /media/documents/     { return 404; }
location ^~ /media/videos/source/ { return 404; }

# Transcoded video: byte-range + throttle after the first 4 MB (spec §11.2 "mp4 module")
location ~* ^/media/videos/.*\.(mp4|webm)$ {
    root /srv;
    mp4;
    mp4_buffer_size     1m;
    mp4_max_buffer_size 5m;
    limit_rate_after 4m;
    limit_rate 1500k;
    expires 30d;
    add_header Accept-Ranges bytes;
    add_header Cache-Control "public, max-age=2592000";
    include /etc/nginx/snippets/security.conf;
    access_log off;
}

# Public media (images, renditions, posters, subtitles, OG/story images)
location /media/ {
    alias /srv/media/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    include /etc/nginx/snippets/security.conf;
    access_log off;
    try_files $uri =404;
}
