# nginx main config (spec §11.2). Site definitions come from /etc/nginx/templates/*.template
# (rendered by the official image's envsubst into /etc/nginx/conf.d/ using DOMAIN, DOMAIN_ALT).
# Snippets: /etc/nginx/snippets/{security,cache,gzip,proxy}.conf

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # --- logging: JSON, last IPv4 octet / IPv6 tail anonymised (spec §11.5) -----------------
    map $remote_addr $remote_addr_anon {
        ~(?P<ip>\d+\.\d+\.\d+)\.    $ip.0;
        ~(?P<ip>[^:]+:[^:]+):       $ip::;
        default                     0.0.0.0;
    }
    log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr_anon",'
        '"host":"$host","request":"$request","status":$status,"bytes":$body_bytes_sent,'
        '"referer":"$http_referer","ua":"$http_user_agent","rt":$request_time,'
        '"upstream_rt":"$upstream_response_time","cache":"$upstream_cache_status",'
        '"request_id":"$request_id"}';
    access_log /var/log/nginx/access.log json buffer=32k flush=5s;

    # --- performance ----------------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    client_body_buffer_size 128k;
    client_max_body_size 2m;            # raised to 512m only under /cms/ (site template)
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # --- compression (gzip; brotli needs a custom nginx build — see TODO_HARDENING H-015) ----
    include /etc/nginx/snippets/gzip.conf;

    # --- rate limiting zones (spec §11.2) ---------------------------------------------------
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=cms_login:10m rate=5r/m;
    # form POST zone: key is empty (= not limited) for GET/HEAD
    map $request_method $post_limit_key {
        default "";
        POST    $binary_remote_addr;
    }
    limit_req_zone $post_limit_key zone=form_post:10m rate=10r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=per_ip:10m;

    # --- micro-cache for anonymous HTML (spec §4.5) -----------------------------------------
    proxy_cache_path /var/cache/nginx/html levels=1:2 keys_zone=html:32m max_size=512m
                     inactive=10m use_temp_path=off;
    # bypass for anything that looks logged-in / stateful
    map $http_cookie $cache_bypass {
        default                 0;
        ~*sessionid=            1;
        ~*csrftoken=            1;
    }
    map $http_authorization $auth_bypass {
        default 0;
        ~.+     1;
    }
    map $request_method $method_bypass {
        default 1;
        GET     0;
        HEAD    0;
    }
    # language cookie is part of the key so /→/uz/ redirects never leak across languages
    map $http_cookie $lang_cookie {
        default             "";
        ~*django_language=(?<l>[a-z_-]+)  $l;
    }

    # --- upstream --------------------------------------------------------------------------
    upstream django {
        server web:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # unknown Host → drop the connection without a response (spec §11.2)
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name _;
        ssl_reject_handshake on;
        return 444;
    }

    # stub_status for nginx-prometheus-exporter (internal network only)
    server {
        listen 8080;
        server_name _;
        access_log off;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        location = /stub_status { stub_status; }
        location = /nginx-health { return 200 "ok\n"; add_header Content-Type text/plain; }
    }

    include /etc/nginx/conf.d/*.conf;
}
