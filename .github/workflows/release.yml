# Release → production (D-088). Publishing a GitHub Release (tag vX.Y.Z, created from `stage`,
# e.g. `make release VERSION=v1.4.0`) promotes the image QA tested on staging — never a rebuild —
# and deploys it to prod after the `prod` environment's required reviewers approve. A failed
# smoke test rolls production back to the previous image automatically.
# Gates: the tag is a semantic version · its commit is on `stage` · staging ran exactly this
# commit successfully · its image exists in the registry.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re)deploy, e.g. v1.4.0
        type: string
        required: true

permissions:
  contents: read
  packages: write
  deployments: read

concurrency:
  group: release-prod
  cancel-in-progress: false

jobs:
  verify:
    name: verify — passed staging
    runs-on: ubuntu-latest
    if: contains(format(',{0},', vars.DEPLOY_ENVIRONMENTS), ',prod,')
    outputs:
      sha: ${{ steps.rel.outputs.sha }}
      image_tag: ${{ steps.rel.outputs.image_tag }}
      version: ${{ steps.rel.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the release commit
        id: rel
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tags look like v1.2.3, got '${TAG}'"; exit 1
          fi
          sha="$(git rev-list -n 1 "refs/tags/${TAG}")"
          {
            echo "sha=${sha}"
            echo "image_tag=${sha::12}"
            echo "version=${TAG}"
          } >> "$GITHUB_OUTPUT"
      - name: The commit is on `stage`
        env:
          SHA: ${{ steps.rel.outputs.sha }}
        run: |
          git fetch --quiet origin stage
          if ! git merge-base --is-ancestor "${SHA}" origin/stage; then
            echo "::error::${SHA::12} is not on the stage branch — only what QA tested goes to prod"; exit 1
          fi
      - name: Staging ran exactly this commit successfully
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.rel.outputs.sha }}
        run: |
          id="$(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=staging&sha=${SHA}" --jq '.[0].id // empty')"
          state=""
          if [[ -n "${id}" ]]; then
            state="$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" --jq '.[0].state // empty')"
          fi
          if [[ "${state}" != "success" ]]; then
            echo "::error::no successful staging deployment of ${SHA::12} (state: ${state:-none}) — deploy it to staging and let QA test it first"
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the tested image (version + prod tags, no rebuild)
        env:
          SHA12: ${{ steps.rel.outputs.image_tag }}
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/web"
          docker manifest inspect "${image}:${SHA12}" >/dev/null
          docker buildx imagetools create -t "${image}:${VERSION}" -t "${image}:prod" "${image}:${SHA12}"
          echo "promoted ${image}:${SHA12} → ${VERSION}, prod" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: prod
    needs: [verify]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      image_tag: ${{ needs.verify.outputs.image_tag }}
      git_sha: ${{ needs.verify.outputs.sha }}
      auto_rollback: true
    secrets: inherit
