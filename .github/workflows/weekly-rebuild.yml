# Weekly base-image rebuild + scan (spec §8): python:3.12-slim security updates reach the
# image even when no code changed. Pushes :<sha>-weekly and re-tags :latest only if trivy passes.
name: Weekly rebuild

on:
  schedule:
    - cron: "0 2 * * 1"   # Mondays 02:00 UTC
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/web" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}-weekly
          build-args: APP_RELEASE=${{ steps.meta.outputs.sha }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}-weekly
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Promote to :latest
        run: |
          docker buildx imagetools create -t ${{ steps.meta.outputs.image }}:latest \
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}-weekly
