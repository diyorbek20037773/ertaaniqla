# Rollback (spec §11.3, D-088): redeploy a previously built image to dev, staging or prod.
# Run from the Actions tab: choose the environment and the image tag — a 12-char git SHA prefix
# (CI build job), a release version (v1.2.3) or "latest" / "stage" / "prod". Prod still waits for
# its required reviewers. Migrations are NOT reverted (the expand/contract rule keeps the previous
# image compatible with the schema).
name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [prod, staging, dev]
        required: true
      tag:
        description: Image tag to deploy (12-char git SHA, v1.2.3, latest, stage, prod)
        type: string
        required: true

permissions:
  contents: read

jobs:
  rollback:
    name: rollback ${{ inputs.environment }} → ${{ inputs.tag }}
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ inputs.environment }}
      image_tag: ${{ inputs.tag }}
    secrets: inherit
