# CI/CD (D-088): every push and pull request is checked; a green push is built into one image
# (ghcr.io/<repo>/web:<12-char sha>) and deployed by the same commit's branch:
#   main / master → dev        (developers check their work)
#   stage         → staging    (QA / testers)
#   GitHub Release vX.Y.Z on a commit QA passed on staging → prod (release.yml, manual approval)
# Production is watched by monitor.yml; incidents become GitHub issues for the developers.
# Deploy jobs run only for environments listed in the repository variable DEPLOY_ENVIRONMENTS
# (e.g. "dev,staging,prod"), so the pipeline stays green before a server exists.
name: CI

on:
  push:
    branches: [main, master, stage]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # a newer push supersedes an older pull-request run; branch runs finish (they may be deploying)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.8.x"
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: ruff · mypy · pytest · pip-audit · translations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ertaaniqla
          POSTGRES_USER: ertaaniqla
          POSTGRES_PASSWORD: ertaaniqla
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ertaaniqla"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://ertaaniqla:ertaaniqla@localhost:5432/ertaaniqla
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      PII_ENCRYPTION_KEYS: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install system deps (libmagic, gettext, ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1 gettext ffmpeg
      - name: uv sync
        run: uv sync --frozen
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: compilemessages
        run: uv run python manage.py compilemessages --ignore=.venv --ignore=node_modules
      - name: pytest (coverage ≥ 85 %)
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - name: translations complete (uz, ru)
        run: uv run python scripts/check_translations.py
      - name: pip-audit
        run: uv export --frozen --no-dev --format requirements-txt -o /tmp/req.txt && uv run pip-audit -r /tmp/req.txt --strict
      - name: django check --deploy (prod settings, dummy env)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-secret-key-with-more-than-fifty-characters-0123456789
          DJANGO_ALLOWED_HOSTS: ertaaniqla.uz
          DJANGO_CSRF_TRUSTED_ORIGINS: https://ertaaniqla.uz
          TURNSTILE_SECRET_KEY: dummy
          TURNSTILE_SITE_KEY: dummy
        run: uv run python manage.py check --deploy --fail-level WARNING
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  # --- SonarQube (self-hosted, ADR-0005): code smells, bugs, security hotspots, duplication,
  # coverage from `quality`. Skipped until vars.SONAR_HOST_URL is configured; a red quality gate
  # stops the pipeline before the image is built.
  sonarqube:
    name: sonarqube · quality gate
    runs-on: ubuntu-latest
    needs: [quality]
    if: vars.SONAR_HOST_URL != ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # blame data for "new code"
      - uses: actions/download-artifact@v8
        with:
          name: coverage
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectVersion=${{ github.sha }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600

  frontend:
    name: tailwind build · bundle budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bundle size budgets (CSS ≤ 40 KB gz, JS ≤ 50 KB gz — spec §4.6)
        run: |
          css=$(gzip -c static/dist/main.css | wc -c); js=$(gzip -c static/dist/main.js | wc -c)
          echo "css=${css}B gz, js=${js}B gz"
          test "$css" -le 40960 && test "$js" -le 51200
      - uses: actions/upload-artifact@v4
        with:
          name: static-dist
          path: static/dist

  a11y-perf:
    name: pa11y-ci · lighthouse-ci (preview server, 3+8 URLs)
    runs-on: ubuntu-latest
    needs: [frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ertaaniqla
          POSTGRES_USER: ertaaniqla
          POSTGRES_PASSWORD: ertaaniqla
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ertaaniqla"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://ertaaniqla:ertaaniqla@localhost:5432/ertaaniqla
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      PII_ENCRYPTION_KEYS: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install system deps (libmagic, gettext)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1 gettext
      - run: uv sync --frozen
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: static-dist
          path: static/dist
      - name: Prepare preview (migrate, seed, institutions, static)
        run: |
          uv run python manage.py compilemessages --ignore=.venv --ignore=node_modules
          uv run python manage.py migrate --noinput
          uv run python manage.py seed_content --lang uz,ru
          uv run python manage.py import_institutions data/institutions.sample.csv
          STATIC_COMPRESSED=1 uv run python manage.py collectstatic --noinput --ignore=src
      - name: Start preview server on :8001
        # the venv's python, not `uv run`: a uv process left running holds the uv cache lock and
        # setup-uv's post step (`uv cache prune`) then waits for it until the job times out
        run: |
          STATIC_COMPRESSED=1 nohup .venv/bin/python manage.py runserver 0.0.0.0:8001 --noreload > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid
          for _ in $(seq 1 30); do curl -fsS http://localhost:8001/healthz/ && break; sleep 1; done
      - name: pa11y-ci (WCAG 2.1 AA, 0 errors on key pages — spec §9)
        run: npx pa11y-ci
      - name: Lighthouse CI (LCP < 2.5 s, CLS < 0.1, TBT < 200 ms on 3 pages — spec §4.6)
        run: npx --yes @lhci/cli@0.14 autorun --config=lighthouserc.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
      - name: Preview log on failure
        if: failure()
        run: cat /tmp/preview.log
      - name: Stop the preview server
        if: always()
        run: kill "$(cat /tmp/preview.pid)" 2>/dev/null || true

  build:
    name: docker build · trivy
    runs-on: ubuntu-latest
    needs: [quality, frontend, a11y-perf, sonarqube]
    # run when sonarqube passed or was skipped (not configured); never after a failure
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/web"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          # channel tag of the branch: latest (main/master) or stage
          if [[ "${GITHUB_REF_NAME}" == "stage" ]]; then echo "channel=stage" >> "$GITHUB_OUTPUT"; else echo "channel=latest" >> "$GITHUB_OUTPUT"; fi
          # build once: a commit fast-forwarded from main to stage already has its image
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]] && docker manifest inspect "${image}:${GITHUB_SHA::12}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        if: steps.meta.outputs.exists != 'true'
        with:
          context: .
          file: docker/web/Dockerfile
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.channel }}
          build-args: APP_RELEASE=${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Re-tag the existing image for this branch (no rebuild)
        if: steps.meta.outputs.exists == 'true'
        run: |
          docker buildx imagetools create \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.channel }}" \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}"
      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0, pinned by SHA (tags were re-published in 2026-03)
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: SBOM (syft, SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
      - name: nginx -t (prod config in the nginx image)
        run: bash docker/scripts/nginx_test.sh
      - name: compose config (prod + profiles)
        run: |
          cp .env.example .env
          docker compose -f compose.yml -f compose.prod.yml --profile monitoring --profile clamav config --quiet
          docker compose -f compose.yml -f compose.prod.yml -f compose.small.yml config --quiet
          docker compose -p ertaaniqla-staging -f compose.yml -f compose.prod.yml -f compose.staging.yml config --quiet
          docker compose -f compose.sonarqube.yml config --quiet
      - name: Prometheus / Alertmanager config check
        run: |
          docker run --rm -v "$PWD/docker/monitoring:/m:ro" --entrypoint sh prom/prometheus:v2.55.1 -c \
            'sed "s|__METRICS_USER__|u|;s|__METRICS_PASS__|p|;s|__DOMAIN__|example.uz|g" /m/prometheus.yml > /tmp/p.yml && cp /m/alert_rules.yml /tmp/ && sed -i "s|/etc/prometheus/alert_rules.yml|/tmp/alert_rules.yml|" /tmp/p.yml && promtool check config /tmp/p.yml'
          docker run --rm -v "$PWD/docker/monitoring:/m:ro" --entrypoint sh prom/alertmanager:v0.27.0 -c \
            'sed "s|__TELEGRAM_BOT_TOKEN__|1:a|;s|__TELEGRAM_ALERT_CHAT_ID__|1|" /m/alertmanager.yml > /tmp/a.yml && amtool check-config /tmp/a.yml'

  # --- dev: every push to main / master (developers check their work) -----------------------
  deploy-dev:
    name: deploy → dev
    needs: [build]
    # explicit result check: a skipped upstream job (sonarqube not configured) must not skip deploys
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      && contains(format(',{0},', vars.DEPLOY_ENVIRONMENTS), ',dev,') }}
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      image_tag: ${{ needs.build.outputs.tag }}
      git_sha: ${{ github.sha }}
    secrets: inherit

  # --- staging: every push to `stage` (QA / testers) -------------------------------------------
  deploy-staging:
    name: deploy → staging
    needs: [build]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'push'
      && github.ref == 'refs/heads/stage'
      && contains(format(',{0},', vars.DEPLOY_ENVIRONMENTS), ',staging,') }}
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image_tag: ${{ needs.build.outputs.tag }}
      git_sha: ${{ github.sha }}
      auto_rollback: true
    secrets: inherit

  # --- prod: release.yml (GitHub Release of a commit that passed staging, manual approval) ------
