# `pre-commit install` installs both hook types (local stage of the pipeline, RUNBOOK §9):
#   commit → ruff/format/secrets checks · push → ruff + mypy + unit tests (full gate: make ci-local)
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-env-file
        name: never commit .env
        entry: bash -c 'git diff --cached --name-only | grep -Ex "\.env(\..*)?" | grep -vx "\.env\.example" && { echo ".env must not be committed"; exit 1; } || exit 0'
        language: system
        pass_filenames: false
      - id: no-todo-in-prod-code
        name: no TODO/NotImplementedError in apps/ and config/
        entry: bash -c 'grep -rnE "NotImplementedError|# TODO|\[\[TODO" apps config --include=*.py | grep -v "seed_content" | grep -v "migrations" && exit 1 || exit 0'
        language: system
        pass_filenames: false
      - id: pre-push-gate
        name: pre-push gate (ruff, mypy, pytest -x)
        entry: bash -c 'uv run ruff check . && uv run ruff format --check . && uv run mypy && uv run pytest -x -q --no-cov'
        language: system
        pass_filenames: false
        stages: [pre-push]
