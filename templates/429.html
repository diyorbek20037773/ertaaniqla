{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Too many requests" %}{% endblock %}
{% block content %}
<div class="container error-page">
  <p class="error-page__code u-gradient-text" aria-hidden="true">429</p>
  <h1 class="error-page__title">{% trans "Too many requests" %}</h1>
  <p class="error-page__text">{% trans "Please wait a minute and try again." %}</p>
  <p class="error-page__actions"><a class="pill pill--ghost" href="/{{ LANGUAGE_CODE }}/">{% trans "Go to the home page" %}</a></p>
</div>
{% endblock %}
