{% load wagtailcore_tags %}
<div class="block block--table table-wrap">
  <table class="table">
    {% if value.caption %}<caption>{{ value.caption }}</caption>{% endif %}
    <thead>
      <tr>{% for column in value.columns %}<th scope="col">{{ column.heading }}</th>{% endfor %}</tr>
    </thead>
    <tbody>
      {% for row in value.rows %}
        <tr>{% for cell in row %}<td>{% include_block cell %}</td>{% endfor %}</tr>
      {% endfor %}
    </tbody>
  </table>
</div>
