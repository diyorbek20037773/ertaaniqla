{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Page not found" %}{% endblock %}
{% block content %}
<div class="container error-page">
  <p class="error-page__code u-gradient-text" aria-hidden="true">404</p>
  <h1 class="error-page__title">{% trans "Page not found" %}</h1>
  <p class="error-page__text">{% trans "The page you are looking for does not exist or has moved." %}</p>
  <p class="error-page__actions"><a class="pill pill--cta" href="/{{ LANGUAGE_CODE }}/">{% trans "Go to the home page" %}</a></p>
</div>
{% endblock %}
