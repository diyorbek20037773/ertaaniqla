# Self-hosted SonarQube Community (ADR-0005). Separate compose project, own Postgres, no public
# ports: the production nginx proxies https://sonar.<DOMAIN> to it (like staging, D-037).
#   docker compose -p ertaaniqla-sonarqube --env-file .env -f compose.sonarqube.yml up -d
# Host prerequisite (Elasticsearch inside SonarQube): sysctl vm.max_map_count=524288 and
# fs.file-max=131072 — set by scripts/bootstrap_vps.sh. First login admin/admin → change it,
# enable "Force user authentication", create the `ertaaniqla` project token for CI (RUNBOOK §9).
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  sonarqube:
    image: sonarqube:26.9.0.129388-community
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      SONAR_WEB_JAVAADDITIONALOPTS: "-Xmx768m"
      SONAR_CE_JAVAADDITIONALOPTS: "-Xmx768m"
      SONAR_SEARCH_JAVAADDITIONALOPTS: "-Xms512m -Xmx512m"
      SONAR_TELEMETRY_ENABLE: "false"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    ulimits:
      nofile: {soft: 131072, hard: 131072}
      nproc: {soft: 8192, hard: 8192}
    depends_on:
      sonar-db:
        condition: service_healthy
    networks:
      - default
      - prod   # so ertaaniqla-prod-nginx-1 can reach ertaaniqla-sonarqube-sonarqube-1:9000
    healthcheck:
      # the image has neither wget nor curl: plain HTTP over bash /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /api/system/status HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 3g
    restart: unless-stopped
    logging: *logging

  sonar-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    volumes:
      - sonar-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped
    logging: *logging

networks:
  prod:
    external: true
    name: ${PROD_NETWORK:-ertaaniqla-prod_default}

volumes:
  sonar-data:
  sonar-extensions:
  sonar-logs:
  sonar-pgdata:
