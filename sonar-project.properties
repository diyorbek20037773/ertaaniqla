# SonarQube code analysis (ADR-0005). Server: compose.sonarqube.yml (self-hosted, same network
# as the prod nginx → https://sonar.<DOMAIN>). CI job `sonarqube` runs after `quality` and
# imports its coverage.xml; locally: `SONAR_HOST_URL=… SONAR_TOKEN=… make sonar`.
sonar.projectKey=ertaaniqla
sonar.projectName=Erta aniqla
sonar.sourceEncoding=UTF-8

sonar.sources=apps,config,templates,static/src,docker,scripts
sonar.tests=tests
sonar.exclusions=**/migrations/**,static/dist/**,**/__pycache__/**,apps/core/seed/tree.py
sonar.test.inclusions=tests/**
# the seed tree is verbatim TZ text; settings modules are declarative
sonar.cpd.exclusions=apps/core/seed/**,config/settings/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=tests/**,scripts/**,docker/**,config/**,static/src/**,templates/**,**/management/commands/seed_*.py
